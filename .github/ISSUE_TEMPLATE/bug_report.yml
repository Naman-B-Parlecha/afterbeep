name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What did you expect, what happened instead?" }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Phone + Android version + Afterbeep version }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`engine.log` / `startup.log` from Android/data/dev.afterbeep/files/"
      render: text
